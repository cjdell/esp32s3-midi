<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile MIDI Keyboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial", sans-serif;
      }

      body {
        background: #121212;
        color: #fff;
        padding: 20px;
        text-align: center;
        touch-action: manipulation;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      h1 {
        margin-bottom: 20px;
        font-size: 1.5rem;
        color: #e0e0e0;
      }

      .keyboard-container {
        position: relative;
        width: 100%;
        max-width: 500px;
        height: 200px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 10px;
      }

      .white-key {
        position: relative;
        width: 12.5%;
        height: 100%;
        background: linear-gradient(to bottom, #f8f8f8, #e0e0e0);
        border: 1px solid #ccc;
        border-radius: 0 0 8px 8px;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 10px;
        font-size: 0.8rem;
        color: #333;
        user-select: none;
        cursor: pointer;
        transition: background 0.1s ease;
      }

      .white-key:active {
        background: linear-gradient(to bottom, #e0e0e0, #c0c0c0);
      }

      .black-key {
        position: absolute;
        top: 0;
        width: 7.5%;
        height: 60%;
        background: linear-gradient(to bottom, #333, #111);
        border-radius: 0 0 6px 6px;
        z-index: 2;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 8px;
        font-size: 0.7rem;
        color: #eee;
        user-select: none;
        cursor: pointer;
        transition: background 0.1s ease;
      }

      .black-key:active {
        background: linear-gradient(to bottom, #555, #333);
      }

      .octave {
        margin-bottom: 20px;
        padding: 10px;
        background: #222;
        border-radius: 8px;
        font-size: 0.9rem;
        color: #aaa;
        min-height: 20px;
      }

      .octave-btn {
        margin: 0 10px;
        padding: 10px 20px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 20px;
        font-size: 0.9rem;
        cursor: pointer;
        transition: background 0.3s;
      }

      .status {
        margin-top: 20px;
        padding: 10px;
        background: #222;
        border-radius: 8px;
        font-size: 0.9rem;
        color: #aaa;
        min-height: 20px;
      }

      .connection-status {
        margin-top: 15px;
        font-size: 0.9rem;
        color: #4caf50;
      }

      .connect-btn {
        margin-top: 20px;
        padding: 10px 20px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 20px;
        font-size: 0.9rem;
        cursor: pointer;
        transition: background 0.3s;
      }

      .connect-btn:disabled {
        background: #666;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h1>Mobile MIDI Keyboard</h1>

    <div class="octave" id="octave">
      <button class="octave-btn" id="octaveDownBtn">Down</button>
      <span>Octave 5</span>
      <button class="octave-btn" id="octaveUpBtn">Up</button>
    </div>

    <div class="keyboard-container" id="keyboard">
      <!-- Keys will be generated by JavaScript -->
    </div>

    <div class="status" id="status">No connection</div>

    <button class="connect-btn" id="connectBtn">Connect to Web Socket</button>

    <div class="connection-status" id="connectionStatus">Disconnected</div>

    <script>
      // const WS_URL = "ws://192.168.1.1/api/ws";  // For testing remotely
      const WS_URL = "/api/ws";

      const octaveDisplay = document.getElementById("octave");
      const octaveDownBtn = document.getElementById("octaveDownBtn");
      const octaveUpBtn = document.getElementById("octaveUpBtn");

      const keyboardContainer = document.getElementById("keyboard");
      const statusDisplay = document.getElementById("status");
      const connectBtn = document.getElementById("connectBtn");
      const connectionStatus = document.getElementById("connectionStatus");

      let socket = null;

      // Define the notes for one octave (C4 to C5)
      const whiteKeys = ["C", "D", "E", "F", "G", "A", "B"];
      const blackKeys = ["C#", "D#", "", "F#", "G#", "A#", ""]; // Empty string for gaps
      const midiNotes = [0, 2, 4, 5, 7, 9, 11, 1, 3, 6, 8, 10]; // C4 to C5 including sharps

      let octave = 5;

      // Create white keys
      for (let i = 0; i < whiteKeys.length; i++) {
        const note = () => octave * 12 + midiNotes[i];
        const key = document.createElement("div");
        key.className = "white-key";
        key.textContent = whiteKeys[i];
        key.dataset.note = note();
        key.addEventListener("mousedown", () => sendNoteOn(note()));
        key.addEventListener("mouseup", () => sendNoteOff(note()));
        key.addEventListener("mouseleave", () => sendNoteOff(note()));
        key.addEventListener("touchstart", (e) => {
          e.preventDefault();
          sendNoteOn(note());
        });
        key.addEventListener("touchend", () => sendNoteOff(note()));
        keyboardContainer.appendChild(key);
      }

      // Create black keys
      const blackKeyPositions = [0, 1, 3, 4, 5]; // Position indices for black keys
      blackKeyPositions.forEach((index, i) => {
        if (blackKeys[index]) {
          const note = () => octave * 12 + midiNotes[whiteKeys.length + i];
          const key = document.createElement("div");
          key.className = "black-key";
          key.textContent = blackKeys[index];
          key.dataset.note = note();
          key.style.left = `${index * 12.5 + 15.0}%`;
          key.addEventListener("mousedown", () => sendNoteOn(note()));
          key.addEventListener("mouseup", () => sendNoteOff(note()));
          key.addEventListener("mouseleave", () => sendNoteOff(note()));
          key.addEventListener("touchstart", (e) => {
            e.preventDefault();
            sendNoteOn(note());
          });
          key.addEventListener("touchend", () => sendNoteOff(note()));
          keyboardContainer.appendChild(key);
        }
      });

      function sendNoteOn(note) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ NoteOn: note }));
          statusDisplay.textContent = `Note On: ${note}`;
        } else {
          statusDisplay.textContent = `Note On: ${note} (Disconnected)`;
        }
      }

      function sendNoteOff(note) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ NoteOff: note }));
          statusDisplay.textContent = `Note Off: ${note}`;
        } else {
          statusDisplay.textContent = `Note Off: ${note} (Disconnected)`;
        }
      }

      function toggleConnection() {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.close();
          connectBtn.textContent = "Connect to Web Socket";
          connectionStatus.textContent = "Disconnected";
          connectionStatus.style.color = "#ff4444";
          return;
        }

        socket = new WebSocket(WS_URL, ["json"]);

        socket.onopen = () => {
          connectBtn.textContent = "Disconnect";
          connectionStatus.textContent = "Connected";
          connectionStatus.style.color = "#4caf50";
          statusDisplay.textContent = "Connected to WebSocket server";
        };

        socket.onmessage = (event) => {
          statusDisplay.textContent = `Received: ${event.data}`;
        };

        socket.onclose = () => {
          connectBtn.textContent = "Connect to Web Socket";
          connectionStatus.textContent = "Disconnected";
          connectionStatus.style.color = "#ff4444";
          socket = null;
        };

        socket.onerror = () => {
          console.log(event);
          statusDisplay.textContent = "WebSocket error";
          connectionStatus.textContent = "Connection failed";
          connectionStatus.style.color = "#ff4444";
          connectBtn.textContent = "Connect to Web Socket";
        };
      }

      octaveDownBtn.addEventListener("click", () => {
        if (octave == 0) return;
        octave--;
        octaveDisplay.querySelector("span").textContent = `Octave ${octave}`;
      });

      octaveUpBtn.addEventListener("click", () => {
        octave++;
        octaveDisplay.querySelector("span").textContent = `Octave ${octave}`;
      });

      connectBtn.addEventListener("click", toggleConnection);

      window.addEventListener("load", toggleConnection);

      // Show instructions on first load
      if (!localStorage.getItem("midiKeyboardTutorialShown")) {
        alert("Tap keys to send MIDI NoteOn/NoteOff events over WebSocket");
        localStorage.setItem("midiKeyboardTutorialShown", "true");
      }
    </script>
  </body>
</html>
