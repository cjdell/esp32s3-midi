[package]
name = "firmware"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-hal = { version = "1.1.0", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.19.0", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
usb-device = { version = "0.3.2", features = ["control-buffer-256"] }
midi-convert = { version = "0.2.0", features = [] }
heapless = "0.9.1"
usbd-midi = "0.5.1"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-usb = "0.6.0"
esp-rtos = { version = "0.3.0", features = [
    "esp32s3",
    "esp-alloc",
    "embassy",
    "esp-radio",
] }
esp-alloc = { version = "0.10.0", features = ["esp32s3", "nightly"] }
embassy-time = "0.5.1"
embassy-usb-logger = "0.6.0"
log = "0.4.29"
static_cell = "2.1.1"
portable-atomic = "1.13.1"
embassy-sync = "0.8.0"
edge-dhcp = "0.7.0"
edge-nal = "0.6.0"
edge-nal-embassy = { version = "0.8.1", default-features = false, features = [
    "dhcpv4",
    "dhcpv4-hostname",
    "dns",
    "proto-ipv4",
    "tcp",
    "udp",
    "medium-ethernet",
    "medium-ip",
] }
embassy-net = { version = "0.8.0", features = [
    "dhcpv4",
    "medium-ethernet",
    "medium-ip",
    "tcp",
    "udp",
    "dhcpv4-hostname",
    "dns",
] }
esp-radio = { version = "0.18.0", features = [
    "esp-alloc",
    "esp32s3",
    "log-04",
    "unstable",
    "wifi",
] }
smoltcp = { version = "0.13.0", default-features = false, features = [
    "medium-ethernet",
    "multicast",
    "proto-dhcpv4",
    "proto-dns",
    "proto-ipv4",
    "socket-dns",
    "socket-icmp",
    "socket-raw",
    "socket-tcp",
    "socket-udp",
] }
esp-wifi-sys-esp32 = "0.2.0"
edge-captive = "0.7.0"
picoserve = { version = "0.18.0", features = ["alloc", "embassy", "ws"] }
serde = { version = "1.0.228", default-features = false, features = [
    "alloc",
    "derive",
] }
serde_json = { version = "1.0.149", default-features = false, features = [
    "alloc",
] }
embedded-io-async = { version = "0.7.0", features = ["alloc"] }

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

# Exactly the same as release (for now)
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
